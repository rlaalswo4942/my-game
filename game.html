<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사과게임</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      font-family: "Malgun Gothic", sans-serif;
    }
    /* 도화지: 얇은 흰 테두리, 화면이 좁으면 비율 유지하며 줄어듦 */
    canvas {
      border: 1px solid #fff;
      max-width: 100%;
      height: auto;
    }
    a {
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <a href="index.html">← 주차별 기록으로 돌아가기</a>
  <script src="game.js"></script>
